name: Update live market data

on:
  schedule:
    # 12:15 UTC = 5:45 PM IST — runs on weekdays, after the NSE market
    # close (3:30 PM IST) and after FII/DII figures are typically published.
    - cron: "15 12 * * 1-5"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas yfinance requests

      - name: Run update script
        run: python scripts/update_data.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json docs/index.html
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Auto-update: latest Nifty 50 + FII/DII data $(date -u +%Y-%m-%d)"
          git push
